[project]
name = "shaper-viewer"
version = "0.0.1"
description = "3D viewer for Shaper Origin SVG cut files"
requires-python = ">=3.10"
dependencies = [
    "svgelements>=1.9",
    "shapely>=2.0",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
shaper-viewer = "shaper_viewer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaper_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
